<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0878f9"><title>Roger — Chat</title><style>
:root{--b:#0878f9;--d:#075bd1;--ink:#073b83}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Comic Sans MS","Comic Sans",cursive;background:var(--b);color:var(--ink);overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:74px 1fr auto;max-width:1050px;margin:auto;padding:0 28px;position:relative}.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#fff 1.4px,transparent 1.4px);background-size:24px 24px}.top{display:flex;align-items:center;justify-content:space-between;position:relative;border-bottom:1px solid #ffffff55}.brand{display:flex;align-items:center;gap:12px;color:#fff;font-size:23px;font-weight:bold}.logo{width:42px;height:42px;display:grid;place-items:center;background:#fff;color:var(--b);border-radius:15px;font-size:24px;box-shadow:0 4px 0 #0053bc}.new{background:#ffffff18;border:2px solid #ffffffb8;color:#fff;border-radius:14px;padding:10px 14px;font-weight:bold}.new:hover{background:#ffffff30}.chat{position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:30px 0}.welcome{margin:auto;text-align:center;padding:25px 12px 45px;max-width:580px}.star{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;background:#fff;border-radius:27px;color:var(--b);font-size:42px;box-shadow:0 7px 0 #0057c4;transform:rotate(-4deg)}h1{margin:0;color:#fff;font-size:clamp(35px,6vw,55px);line-height:1.1;letter-spacing:-1px}.sub{color:#e6f2ff;font-size:17px;line-height:1.6;margin:15px auto 0;max-width:420px}.ideas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}.idea{background:#fff;border:2px solid #fff;color:var(--b);border-radius:15px;padding:11px 14px;font-size:14px;font-weight:bold;box-shadow:0 4px 0 #0053bc}.idea:hover{transform:translateY(-2px)}.messages{width:100%;max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}.msg{align-self:flex-end;max-width:85%;padding:15px 19px;border-radius:21px 21px 7px 21px;background:#fff;color:#0750ad;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 4px 0 #0053bc}.bottom{position:relative;padding:14px 0 20px}.composer{display:flex;align-items:flex-end;gap:10px;background:#fff;padding:10px;border:3px solid #d8eaff;border-radius:24px;box-shadow:0 7px 0 #0053bc}textarea{flex:1;min-width:0;resize:none;max-height:140px;min-height:43px;border:0;outline:0;padding:11px 12px;color:var(--ink);background:transparent;font-size:16px;line-height:1.4}textarea::placeholder{color:#7ca7dc}.send{flex:0 0 46px;height:46px;border:0;border-radius:16px;background:var(--b);color:#fff;font-size:25px;font-weight:bold;box-shadow:0 3px 0 #0053bc}.send:hover{background:var(--d)}.send:disabled{opacity:.4;cursor:not-allowed}.note{text-align:center;color:#e3f0ff;font-size:12px;padding:12px 4px 0}button:focus-visible,textarea:focus-visible{outline:3px solid #ffe36b;outline-offset:3px}@media(max-width:600px){.app{padding:0 14px;grid-template-rows:66px 1fr auto}.brand{font-size:20px}.logo{width:37px;height:37px}.new{padding:8px 10px;font-size:13px}.chat{padding-top:15px}.sub{font-size:15px}.idea{font-size:13px;padding:9px 11px}.msg{max-width:93%}.bottom{padding-bottom:13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">R!</div><span>Roger</span></div><button class="new" id="new" type="button">＋ New chat</button></header><main class="chat" id="chat"><section class="welcome" id="welcome"><div class="star">✳</div><h1>What's on your mind?</h1><p class="sub">A fresh little space for big ideas, random thoughts, and whatever you're making.</p><div class="ideas"><button class="idea" type="button">Help me brainstorm</button><button class="idea" type="button">I have a project idea</button><button class="idea" type="button">Let's make something</button></div></section><div class="messages" id="messages"></div></main><footer class="bottom"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Write something..." aria-label="Message"></textarea><button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button></form><div class="note">Just the chat interface. No chatbot is connected.</div></footer></div><script>
const input=document.querySelector('#input'),send=document.querySelector('#send'),messages=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),chat=document.querySelector('#chat');function fit(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';send.disabled=!input.value.trim()}function add(text){const m=document.createElement('div');m.className='msg';m.textContent=text;messages.append(m);welcome.hidden=true;chat.scrollTop=chat.scrollHeight}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;add(t);input.value='';fit();input.focus()});input.addEventListener('input',fit);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}});document.querySelectorAll('.idea').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent;fit();input.focus()}));document.querySelector('#new').addEventListener('click',()=>{messages.replaceChildren();welcome.hidden=false;input.value='';fit();chat.scrollTop=0;input.focus()});fit();
</script></body></html>
