name: Roger Spark training and export

# Manual runs only: editing this workflow must not interrupt or duplicate an
# already-running tokenization/training job. Each 5k chunk publishes a checkpoint.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Total target training steps (must be a multiple of 5000; default 75000)
        required: true
        default: "75000"

permissions:
  contents: write

jobs:
  train-export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Restore training checkpoint cache
        uses: actions/cache@v4
        with:
          path: training/checkpoints
          key: roger-spark-checkpoint-${{ github.run_id }}
          restore-keys: |
            roger-spark-checkpoint-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt

      - name: Set requested training target
        shell: bash
        env:
          REQUESTED_STEPS: ${{ inputs.steps || '75000' }}
        run: |
          if ! [[ "$REQUESTED_STEPS" =~ ^[0-9]+$ ]] || (( REQUESTED_STEPS < 5000 || REQUESTED_STEPS > 75000 || REQUESTED_STEPS % 5000 != 0 )); then
            echo "steps must be a multiple of 5000 from 5000 through 75000"
            exit 1
          fi
          echo "REQUESTED_STEPS=$REQUESTED_STEPS" >> "$GITHUB_ENV"

      - name: Train through step 5,000
        if: ${{ success() && env.REQUESTED_STEPS >= '5000' }}
        run: python -u training/train.py --steps 5000 --batch-size 1 --resume

      - name: Publish checkpoint at step 5,000
        if: ${{ success() && env.REQUESTED_STEPS >= '5000' }}
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-checkpoint-step-5000
          path: |
            training/checkpoints/roger_spark_latest.pt
            roger_spark_tokenizer.json
          if-no-files-found: error
          retention-days: 30

      - name: Train through step 10,000
        if: ${{ success() && env.REQUESTED_STEPS >= '10000' }}
        run: python -u training/train.py --steps 10000 --batch-size 1 --resume

      - name: Publish checkpoint at step 10,000
        if: ${{ success() && env.REQUESTED_STEPS >= '10000' }}
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-checkpoint-step-10000
          path: |
            training/checkpoints/roger_spark_latest.pt
            roger_spark_tokenizer.json
          if-no-files-found: error
          retention-days: 30

      - name: Train through step 15,000
        if: ${{ success() && env.REQUESTED_STEPS >= '15000' }}
        run: python -u training/train.py --steps 15000 --batch-size 1 --resume

      - name: Publish checkpoint at step 15,000
