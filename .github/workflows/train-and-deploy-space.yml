name: Roger Spark training and export

# Long training is deliberately manual: pushing source changes must not start
# another expensive run. Full training needs a CUDA GPU runner.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: Training steps (production default is 75000)
        required: true
        default: "75000"

permissions:
  contents: write

jobs:
  train-export:
    # Configure a self-hosted CUDA runner with labels linux, x64, gpu.
    # GitHub-hosted ubuntu-latest runners do not provide a CUDA GPU.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt
      - name: Train on TinyStories
        shell: bash
        run: |
          python -u training/train.py --steps "${{ inputs.steps }}" --require-cuda
      - name: Export ONNX FP16 for WebGPU
        run: python training/export_browser.py
      - name: Save browser deployment files
        run: |
          cp training/roger_spark_final.pt /tmp/roger_spark_final.pt
          git add roger_spark.onnx roger_spark_tokenizer.json roger_spark_config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export Roger Spark 25M WebGPU model [skip ci]'
          git push
      - name: Upload final checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-25m-checkpoint
          path: /tmp/roger_spark_final.pt
          retention-days: 14
