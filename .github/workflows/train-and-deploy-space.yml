name: Train Roger Spark for browser

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'training/data.jsonl'
      - 'training/train.py'
      - 'training/roger_spark.py'
      - 'training/export_browser.py'
      - 'browser_model.js'
      - '.github/workflows/train-and-deploy-space.yml'

permissions:
  contents: write

concurrency:
  group: roger-spark-browser-training
  cancel-in-progress: false

jobs:
  train-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt
      - name: Train from random initialization
        run: python training/train.py --steps 1500 --batch-size 8 --max-seq 128 --width 64 --layers 2 --heads 4 --out training/roger_spark.pt
      - name: Export browser weights
        run: python training/export_browser.py
      - name: Commit trained browser model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roger_spark_weights.json
          if git diff --cached --quiet; then
            echo 'Trained weights did not change.'
          else
            git commit -m 'Update scratch-trained Roger Spark browser weights [skip ci]'
            git push
          fi
