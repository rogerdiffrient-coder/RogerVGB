name: Train Roger Spark for browser

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'training/data.jsonl'
      - 'training/train.py'
      - 'training/roger_spark.py'
      - 'training/export_browser.py'
      - 'browser_model.js'
      - '.github/workflows/train-and-deploy-space.yml'

permissions:
  contents: write

concurrency:
  group: roger-spark-browser-training
  cancel-in-progress: false

jobs:
  train-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt
      - name: Train from random initialization
        run: python -u training/train.py --steps 10000 --batch-size 8 --max-seq 128 --width 128 --layers 4 --heads 4 --out training/roger_spark.pt
      - name: Export browser weights
        run: python training/export_browser.py
      - name: Commit trained browser model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roger_spark_weights.json
          if git diff --cached --quiet; then
            echo 'Trained weights did not change.'
          else
            git commit -m 'Update scratch-trained Roger Spark browser weights [skip ci]'
            # The website or another workflow may push to main while training runs.
            # Rebase onto the latest main and retry if a push races with another commit.
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              echo "Push raced with another commit (attempt $attempt); retrying..."
              sleep 2
            done
            echo "Could not push trained weights after 3 attempts."
            exit 1
          fi
