      - name: Train through step 75,000
        if: ${{ success() && env.REQUESTED_STEPS >= '75000' }}
        run: python -u training/train.py --steps 75000 --batch-size 1 --resume

      - name: Publish checkpoint at step 75,000
        if: ${{ success() && env.REQUESTED_STEPS >= '75000' }}
        uses: actions/upload-artifact@v4
        with:
