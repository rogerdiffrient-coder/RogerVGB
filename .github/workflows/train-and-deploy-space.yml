name: Train and deploy Roger Spark

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'training/data.jsonl'
      - 'training/train.py'
      - 'training/roger_spark.py'
      - 'training/server.py'
      - 'space/**'
      - '.github/workflows/train-and-deploy-space.yml'

permissions:
  contents: write

concurrency:
  group: roger-spark-train-deploy
  cancel-in-progress: false

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt huggingface_hub
      - name: Train from random initialization
        run: python training/train.py --steps 1500 --batch-size 8 --max-seq 192 --out training/roger_spark.pt
      - name: Validate checkpoint
        run: python - <<'PY'
          import torch
          p = torch.load('training/roger_spark.pt', map_location='cpu', weights_only=False)
          assert p.get('tokenizer') == 'utf8-byte-v1'
          assert p.get('state_dict') and p.get('config')
          print('Validated scratch-trained checkpoint:', p['config'])
          PY
      - name: Prepare Hugging Face Space bundle
        run: |
          mkdir -p /tmp/roger-spark-space/training
          cp space/README.md space/Dockerfile space/requirements.txt /tmp/roger-spark-space/
          cp training/roger_spark.py training/server.py training/roger_spark.pt /tmp/roger-spark-space/training/
      - name: Publish trained model and API to Hugging Face Spaces
        if: ${{ (vars.ROGER_SPARK_SPACE != '' || true) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.ROGER_SPARK_SPACE || 'How2FixBug/roger-spark' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo 'HF_TOKEN is missing; skipping Space upload.'; exit 0; fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo_id = os.environ['HF_SPACE_ID'].strip()
          if '/' not in repo_id:
              raise SystemExit('ROGER_SPARK_SPACE must be a Hugging Face Space ID like username/roger-spark')
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(repo_id=repo_id, repo_type='space', space_sdk='docker', exist_ok=True)
          api.upload_folder(folder_path='/tmp/roger-spark-space', repo_id=repo_id, repo_type='space', commit_message='Train and deploy scratch-trained Roger Spark')
          print('Uploaded to https://huggingface.co/spaces/' + repo_id)
          PY
      - name: Configure public website endpoint
        if: ${{ vars.ROGER_SPARK_SPACE != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.ROGER_SPARK_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo 'HF_TOKEN is missing; leaving the website endpoint unchanged.'; exit 0; fi
          python - <<'PY'
          import os
          from pathlib import Path
          space_id = os.environ['HF_SPACE_ID'].strip()
          if '/' not in space_id:
              raise SystemExit('ROGER_SPARK_SPACE must be username/space-name')
          api = 'https://' + space_id.replace('/', '-') + '.hf.space'
          Path('api-config.js').write_text('// Generated by the Train and deploy Roger Spark workflow.\nwindow.ROGER_SPARK_SPACE = ' + repr(space_id) + ';\nwindow.ROGER_SPARK_API = ' + repr(api) + ';\n', encoding='utf-8')
          PY
          if ! git diff --quiet -- api-config.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api-config.js
            git commit -m 'Configure Roger Spark hosted API endpoint [skip ci]'
            git push
          fi
      - name: Explain missing hosting configuration
        if: ${{ vars.ROGER_SPARK_SPACE == '' }}
        run: echo 'Training succeeded, but deployment was skipped. Add repository secret HF_TOKEN and repository variable ROGER_SPARK_SPACE (username/space-name), then run this workflow again.'