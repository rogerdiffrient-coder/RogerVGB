name: Roger Spark training and export

# Manual so normal site edits never launch a costly training run.
# Uses GitHub-hosted CPU runners; the checkpoint cache lets a later run resume.
on:
  # Start this training workflow when its configuration is committed; it will
  # not retrigger when the model exports are pushed.
  push:
    paths:
      - ".github/workflows/train-and-deploy-space.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: Total target training steps (production target is 75000)
        required: true
        default: "75000"

permissions:
  contents: write

jobs:
  train-export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Restore training checkpoint
        uses: actions/cache@v4
        with:
          path: training/checkpoints
          key: roger-spark-checkpoint-${{ github.run_id }}
          restore-keys: |
            roger-spark-checkpoint-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt

      - name: Train on TinyStories (CPU if no accelerator is available)
        shell: bash
        run: |
          python -u training/train.py --steps "${{ inputs.steps }}" --batch-size 1 --resume

      - name: Export ONNX FP16 for WebGPU
        if: success()
        run: python training/export_browser.py

      - name: Save browser deployment files
        if: success()
        run: |
          git add roger_spark.onnx roger_spark_tokenizer.json roger_spark_config.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export Roger Spark 25M WebGPU model [skip ci]' || echo "No export changes to commit"
          git push

      - name: Upload latest checkpoint even if training stops early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-checkpoint
          path: |
            training/checkpoints/roger_spark_latest.pt
            roger_spark_tokenizer.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload final checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-25m-checkpoint
          path: training/roger_spark_final.pt
          retention-days: 30
