name: Export Roger Spark browser model

on:
  push:
    paths:
      - "roger_spark_tokenizer.json"
      - ".github/workflows/export-browser-model.yml"
      - "training/validate_browser_onnx.py"
      - "training/export_browser_onnx.py"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing roger_spark_final.pt
        required: true
        default: spark-v1-5000-steps

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install export dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/requirements.txt

      - name: Download trained checkpoint from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'spark-v1-5000-steps' }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "roger_spark_final.pt" --dir training

      - name: Install ONNX Runtime for parity diagnostics
        run: python -m pip install onnxruntime

      - name: Verify the original tokenizer is present
        run: |
          test -s roger_spark_tokenizer.json
          python - <<'PY'
          import json
          with open("roger_spark_tokenizer.json", encoding="utf-8") as f:
              tokenizer = json.load(f)
          vocab = tokenizer.get("model", {}).get("vocab", {})
          if len(vocab) != 6144:
              raise SystemExit(f"Expected 6144 tokenizer entries, found {len(vocab)}")
          print(f"Using committed tokenizer with {len(vocab)} vocabulary entries.")
          PY

      - name: Download currently published ONNX for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'spark-v1-5000-steps' }}
        run: |
          mkdir -p training/current-model
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "roger_spark.onnx" --dir training/current-model

      - name: Check published ONNX (diagnostic only)
        continue-on-error: true
        run: python training/validate_browser_onnx.py --checkpoint training/roger_spark_final.pt --onnx training/current-model/roger_spark.onnx

      - name: Export and validate ONNX
        run: |
          python training/export_browser_onnx.py --checkpoint training/roger_spark_final.pt --fp32
          python training/validate_browser_onnx.py --checkpoint training/roger_spark_final.pt --onnx roger_spark.onnx

      - name: Publish model and matching files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'spark-v1-5000-steps' }}
        run: |
          gh release upload "$RELEASE_TAG" roger_spark.onnx --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" roger_spark_tokenizer.json roger_spark_config.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit browser tokenizer and config
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roger_spark_tokenizer.json roger_spark_config.json
          git commit -m 'Publish Roger Spark browser tokenizer and config [skip ci]' || echo "No metadata changes to commit"
          git push
