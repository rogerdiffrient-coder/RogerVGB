name: Train Roger Spark (experimental)

on:
  push:
    branches: [main]
    paths:
      - "data/roger_training.txt"
      - "model/train.py"
      - "model/cloud_config.json"
      - "model/smoke_test.py"
      - "webgpu/engine.js"
  workflow_dispatch:
    inputs:
      steps:
        description: "Additional training steps"
        required: true
        default: "20000"
        type: choice
        options:
          - "1000"
          - "3000"
          - "5000"
          - "10000"
          - "20000"
          - "50000"

permissions:
  contents: write

concurrency:
  group: roger-spark-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out RogerVGB
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install training dependencies
        run: python -m pip install -r requirements-model.txt

      - name: Verify this runner can handle the published model
        run: |
          python - <<'PY'
          import json
          with open("webgpu/model/manifest.json", encoding="utf-8") as f:
              c = json.load(f)["config"]
          if c["d_model"] > 256 or c["n_layers"] > 6:
              raise SystemExit(
                  "This cloud workflow is CPU-only and limited to small models. "
                  "Use a GPU runner for larger configurations."
              )
          print(f"CPU-safe experiment: width={c['d_model']}, layers={c['n_layers']}")
          PY

      - name: Restore the latest full-precision checkpoint
        id: checkpoint-cache
        uses: actions/cache/restore@v4
        with:
          path: models/roger-0.1-spark
          key: roger-spark-v3-checkpoint-${{ github.run_id }}
          restore-keys: |
            roger-spark-v3-checkpoint-

      - name: Train or continue the multi-million-parameter model
        run: |
          if [ -f models/roger-0.1-spark/checkpoint.pt ] && [ -f models/roger-0.1-spark/tokenizer.json ]; then
            echo "Continuing the cached Roger Spark v2 checkpoint."
            python model/train.py \
              --resume \
              --steps "${{ inputs.steps || '20000' }}" \
              --batch-size 1 \
              --sequence-length 64 \
              --learning-rate 0.00005 \
              --save-every 500 \
              --eval-every 250 \
              --data data/roger_training.txt \
              --output models/roger-0.1-spark
          else
            echo "Starting Roger Spark v2 from random initialization."
            python model/train.py \
              --config model/cloud_config.json \
              --steps "${{ inputs.steps || '10000' }}" \
              --batch-size 1 \
              --sequence-length 64 \
              --learning-rate 0.0001 \
              --save-every 500 \
              --eval-every 250 \
              --data data/roger_training.txt \
              --output models/roger-0.1-spark
          fi

      - name: Smoke-test tokenizer and trained model
        run: python model/smoke_test.py --model-dir models/roger-0.1-spark

      - name: Cache full-precision checkpoint for the next run
        uses: actions/cache/save@v4
        with:
          path: models/roger-0.1-spark
          key: roger-spark-v3-checkpoint-${{ github.run_id }}

      - name: Export the best validation checkpoint as browser weights
        run: >-
          python model/export_webgpu.py
          --checkpoint models/roger-0.1-spark/best_checkpoint.pt
          --output webgpu/model

      - name: Publish updated model weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webgpu/model/manifest.json webgpu/model/weights.bin webgpu/model/tokenizer.json
          if git diff --cached --quiet; then
            echo "No exported model changes to publish."
          else
            git commit -m "Train Roger Spark model weights"

            # Training can take a while, so code commits may land on main
            # after checkout. Rebase the generated-weights commit onto the
            # latest main and retry the push instead of losing the model.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Could not rebase model export onto latest main."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published trained model weights."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep 2
            done
            echo "Failed to publish trained model weights after 3 attempts."
            exit 1
          fi
