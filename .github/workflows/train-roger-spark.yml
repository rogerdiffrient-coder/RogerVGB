name: Train Roger Spark (experimental)

on:
  push:
    branches: [main]
    paths:
      - "data/roger_training.txt"
      - "model/train.py"
      - "model/prepare_corpus.py"
      - "data/SOURCES.md"
      - "model/cloud_config.json"
      - "model/smoke_test.py"
      - "webgpu/engine.js"
  workflow_dispatch:
    inputs:
      compute:
        description: "CPU uses GitHub-hosted runner; GPU requires your own self-hosted runner labeled gpu"
        required: true
        default: "cpu"
        type: choice
        options:
          - "cpu"
          - "self-hosted-gpu"
      steps:
        description: "Additional training steps"
        required: true
        default: "5000"
        type: choice
        options:
          - "1000"
          - "3000"
          - "5000"
          - "10000"

permissions:
  contents: write

concurrency:
  group: roger-spark-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ${{ inputs.compute == 'self-hosted-gpu' && fromJSON('["self-hosted", "linux", "x64", "gpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out RogerVGB
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install training dependencies
        run: python -m pip install -r requirements-model.txt

      - name: Build expanded training corpus
        run: python -u model/prepare_corpus.py --base data/roger_training.txt --output data/roger_training_expanded.txt --target-story-chars 300000 --target-dialogue-chars 600000

      - name: Verify the 100M target configuration
        run: |
          python - <<'PY'
          import json
          with open("model/cloud_config.json", encoding="utf-8") as f:
              c = json.load(f)
          d, layers, vocab, context = c["d_model"], c["n_layers"], c["vocab_size"], c["context_length"]
          if d % c["n_heads"]:
              raise SystemExit("d_model must be divisible by n_heads.")
          # This architecture ties input/output embeddings and uses bias-free projections.
          params = vocab*d + context*d + layers*(12*d*d + 4*d) + 2*d
          print(f"Target: {params:,} parameters ({params/1e6:.2f}M)")
          if not 80_000_000 <= params <= 120_000_000:
              raise SystemExit("Expected a model in the 80M–120M parameter range.")
          print("NOTE: GitHub-hosted runner is CPU-only; 100M training will be slower.")
          PY

      - name: Restore the latest full-precision checkpoint
        id: checkpoint-cache
        uses: actions/cache/restore@v4
        with:
          path: models/roger-0.1-spark
          key: roger-spark-v6-checkpoint-${{ github.run_id }}
          restore-keys: |
            roger-spark-v6-checkpoint-

      - name: Train or continue the multi-million-parameter model
        run: |
          set -o pipefail
          mkdir -p models/roger-0.1-spark
          if [ -f models/roger-0.1-spark/checkpoint.pt ] && [ -f models/roger-0.1-spark/tokenizer.json ]; then
            echo "Continuing the cached Roger Spark checkpoint."
            python -u model/train.py \
              --resume \
              --steps "${{ inputs.steps || '5000' }}" \
              --batch-size "${{ inputs.compute == 'self-hosted-gpu' && '4' || '1' }}" \
              --sequence-length 128 \
              --eval-batches 32 \
              --precision auto \
              --learning-rate 0.00005 \
              --dropout 0.1 \
              --loss-mode assistant \
              --save-every 500 \
              --eval-every 250 \
              --data data/roger_training_expanded.txt \
              --output models/roger-0.1-spark 2>&1 | tee -a models/roger-0.1-spark/training.log
          else
            echo "Starting Roger Spark 100M from random initialization."
            python -u model/train.py \
              --config model/cloud_config.json \
              --steps "${{ inputs.steps || '5000' }}" \
              --batch-size "${{ inputs.compute == 'self-hosted-gpu' && '4' || '1' }}" \
              --sequence-length 128 \
              --eval-batches 32 \
              --precision auto \
              --learning-rate 0.0001 \
              --dropout 0.1 \
              --loss-mode assistant \
              --save-every 500 \
              --eval-every 250 \
              --data data/roger_training_expanded.txt \
              --output models/roger-0.1-spark 2>&1 | tee -a models/roger-0.1-spark/training.log
          fi

      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roger-spark-training-logs
          path: |
            models/roger-0.1-spark/training.log
            models/roger-0.1-spark/training_state.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke-test tokenizer and trained model
        run: python model/smoke_test.py --model-dir models/roger-0.1-spark

      - name: Cache full-precision checkpoint for the next run
        uses: actions/cache/save@v4
        with:
          path: models/roger-0.1-spark
          key: roger-spark-v6-checkpoint-${{ github.run_id }}

      - name: Export the best validation checkpoint as browser weights
        run: >-
          python model/export_webgpu.py
          --checkpoint models/roger-0.1-spark/best_checkpoint.pt
          --output webgpu/model

      - name: Publish updated model weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A webgpu/model/
          if git diff --cached --quiet; then
            echo "No exported model changes to publish."
          else
            git commit -m "Train Roger Spark model weights"

            # Training can take a while, so code commits may land on main
            # after checkout. Rebase the generated-weights commit onto the
            # latest main and retry the push instead of losing the model.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Could not rebase model export onto latest main."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published trained model weights."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying."
              sleep 2
            done
            echo "Failed to publish trained model weights after 3 attempts."
            exit 1
          fi
